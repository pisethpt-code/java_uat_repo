plugins {
    id 'application'
    id 'java'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.1.4'
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework:spring-core:5.3.39'
    implementation 'org.springframework:spring-beans:5.3.39'
    implementation 'org.springframework:spring-context:5.3.39'
    implementation 'org.springframework:spring-web:5.3.39'
    implementation 'org.springframework:spring-webmvc:5.3.39'

    // Embedded Tomcat (if you build a standalone web app)
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:9.0.98'
    implementation 'org.apache.tomcat.embed:tomcat-embed-el:9.0.98'
    implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:9.0.98'

    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'com.sun.xml.bind:jaxb-impl:2.3.3'
    implementation 'com.sun.xml.bind:jaxb-core:2.3.0.1'
    implementation 'javax.activation:activation:1.1.1'

    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    implementation 'com.oracle.database.jdbc:ojdbc8:19.23.0.0'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    // Oracle JDBC and XML dependencies
    implementation 'com.oracle.database.jdbc:ojdbc8:19.23.0.0'
    implementation 'com.oracle.database.xml:xdb:19.23.0.0'
    implementation 'com.oracle.database.xml:xmlparserv2:19.23.0.0'

}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

application {
    mainClass = 'uat.App'
}

tasks.named('test') {
    useJUnitPlatform()
}